name: Feature request
description: Suggest an improvement or a new capability for flagcast.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - gateway
        - evaluator
        - ai
        - mcp
        - console
        - Go SDK
        - infra
        - not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
