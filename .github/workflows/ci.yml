name: CI

on:
  push:
    branches: [trunk, main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Verify gofmt
        run: test -z "$(gofmt -l apps packages)" || { gofmt -l apps packages; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          for svc in gateway evaluator ai; do go build -trimpath -o /tmp/$svc ./apps/$svc/cmd; done
      - name: Test (race)
        run: CGO_ENABLED=1 go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm type-check
      - name: Build
        run: pnpm build
