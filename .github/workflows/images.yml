name: images

on:
  push:
    branches: [trunk]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [gateway, evaluator, ai, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          build-args: SVC=${{ matrix.svc }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.svc }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/console
          file: apps/console/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/console:latest
            ghcr.io/${{ github.repository }}/console:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
