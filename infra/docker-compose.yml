# ==============================================================================
# flagcast — local development stack.
#   Up   : docker compose -f infra/docker-compose.yml up -d
#   Down : docker compose -f infra/docker-compose.yml down -v
#
# Phase 0: backing stores (mongo/redis/nats) + the gateway health stub wired in
# so the stack runs end to end. Services land as each phase merges. See PLAN.md.
# ==============================================================================

name: flagcast

x-go-svc: &go-svc
  build:
    context: ..
    dockerfile: Dockerfile
    target: dev
  env_file: [../.env]
  environment:
    MONGO_URI: mongodb://flagcast:flagcast@mongo:27017/flagcast?authSource=admin
    REDIS_URL: redis://redis:6379/0
    NATS_URL: nats://nats:4222
  volumes:
    - ..:/src:cached
    - go-build:/root/.cache/go-build
    - go-mod:/go/pkg/mod
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
    nats: { condition: service_healthy }
  restart: unless-stopped
  networks: [flagcast-net]

services:
  mongo:
    image: mongo:7
    container_name: flagcast-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-flagcast}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-flagcast}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-flagcast}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports: ["127.0.0.1:27097:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [flagcast-net]

  redis:
    image: redis:7-alpine
    container_name: flagcast-redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6397:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [flagcast-net]

  nats:
    image: nats:2-alpine
    container_name: flagcast-nats
    command: ["-js", "-m", "8222"]
    volumes: [nats-data:/data]
    ports: ["127.0.0.1:4297:4222", "127.0.0.1:8297:8222"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [flagcast-net]

  gateway:
    <<: *go-svc
    container_name: flagcast-gateway
    command: ["go", "run", "./apps/gateway/cmd"]
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://flagcast:flagcast@mongo:27017/flagcast?authSource=admin
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      AI_URL: http://ai:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["0.0.0.0:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  evaluator:
    <<: *go-svc
    container_name: flagcast-evaluator
    command: ["go", "run", "./apps/evaluator/cmd"]
    environment:
      PORT: "8081"
      GRPC_ADDR: ":50051"
      MONGO_URI: mongodb://flagcast:flagcast@mongo:27017/flagcast?authSource=admin
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      RESYNC_SECONDS: ${RESYNC_SECONDS:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["0.0.0.0:50051:50051"]

  ai:
    <<: *go-svc
    container_name: flagcast-ai
    command: ["go", "run", "./apps/ai/cmd"]
    environment:
      PORT: "8090"
      MONGO_URI: mongodb://flagcast:flagcast@mongo:27017/flagcast?authSource=admin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  console:
    image: node:24-alpine
    container_name: flagcast-console
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm dev --host"
    environment:
      VITE_API_PROXY: http://gateway:8080
    volumes:
      - ../apps/console:/app
      - console-node-modules:/app/node_modules
    ports: ["0.0.0.0:5173:5173"]
    depends_on: [gateway]
    restart: unless-stopped
    networks: [flagcast-net]

  # --- observability profile: docker compose --profile observability up ---
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: flagcast-jaeger
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC
    restart: unless-stopped
    networks: [flagcast-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: flagcast-prometheus
    profiles: [observability]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9099:9090"]
    restart: unless-stopped
    networks: [flagcast-net]

  grafana:
    image: grafana/grafana:latest
    container_name: flagcast-grafana
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3099:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [flagcast-net]

volumes:
  grafana-data:
  console-node-modules:
  mongo-data:
  redis-data:
  nats-data:
  go-build:
  go-mod:

networks:
  flagcast-net:
    driver: bridge
