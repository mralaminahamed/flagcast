global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: flagcast
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: gateway }
      - targets: ["evaluator:8081"]
        labels: { service: evaluator }
      - targets: ["ai:8090"]
        labels: { service: ai }
